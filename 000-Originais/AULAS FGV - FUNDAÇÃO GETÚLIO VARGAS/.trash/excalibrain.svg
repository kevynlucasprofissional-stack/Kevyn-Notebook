<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1238.92578125 344" width="1238.92578125" height="344" class="excalidraw-svg"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Cascadia; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1238.92578125" height="344" fill="#0c3e6aff"></rect><g transform="translate(10 10) rotate(0 609.462890625 162)"><text x="609.462890625" y="28.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">🚀 To get started</text><text x="609.462890625" y="64.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">select a document using the search in the top left or</text><text x="609.462890625" y="100.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">open a document in another pane.</text><text x="609.462890625" y="136.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="609.462890625" y="172.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">✨ For the best experience enable 'Open in adjacent pane'</text><text x="609.462890625" y="208.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">in Excalidraw settings under 'Links and Transclusion'.</text><text x="609.462890625" y="244.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="609.462890625" y="280.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">⚠ ExcaliBrain may need to wait for DataView to initialize its index.</text><text x="609.462890625" y="316.400390625" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="30px" fill="#ffffffff" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">This can take up to a few minutes after starting Obsidian.</text></g></svg>